<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  The page is served from a virtual host mapped to a local folder and never
  talks to the network, so everything is locked to 'self'. Inline styles are the
  one exception: xterm.js renders by injecting a stylesheet element of generated
  character rules, which a bare 'self' would block.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'" />
<title>Claude</title>
<link rel="stylesheet" href="vendor/xterm.css" />
<link rel="stylesheet" href="terminal.css" />
</head>
<body>
<div id="terminal" role="application" aria-label="Claude Code terminal"></div>
<div id="overlay" hidden>
  <div id="overlay-card">
    <p id="overlay-title"></p>
    <p id="overlay-detail"></p>
  </div>
</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-web-links.js"></script>
<script src="terminal.js"></script>
</body>
</html>
